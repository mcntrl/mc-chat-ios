# Mission Control Chat (MIS-103): white-labelled Element X iOS, built and sent to TestFlight.
# Runs on demand only (macOS minutes are scarce). The upstream Element workflows are removed in this fork.
# Signing is fully automatic: the App Store Connect API key (Admin) lets xcodebuild register the bundle IDs,
# the app group and the push capability, and create the distribution certificate and profiles itself.
# Nothing secret is printed.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (off = archive and export only)
        type: boolean
        default: true
      unsigned:
        description: Compile check only, no signing (works without the ASC secrets)
        type: boolean
        default: false

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archive:
    # Element X needs Xcode 27 (iOS 27 SDK). GitHub's hosted xcode-27 image has it; macos-26 stops at 26.6.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Select Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          # Release builds only: skip Release_Candidate / beta copies (build 1-2 picked the 27.2 RC by sort order).
          # Xcode_27.2.app is only a symlink to the 27.2 RC on this image, so filter on the resolved path.
          XC=$(for x in /Applications/Xcode_27*.app; do r=$(cd "$x" && pwd -P); echo "$r"; done | grep -viE 'candidate|beta|_rc' | sort -uV | tail -1)
          echo "Using $XC"
          case "$XC" in *andidate*|*eta*|"") echo "No release Xcode 27 found"; exit 1;; esac
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Generate the Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen

      - name: Compile check (unsigned)
        if: inputs.unsigned
        run: |
          xcodebuild archive -project ElementX.xcodeproj -scheme ElementX -configuration Release \
            -destination generic/platform=iOS -archivePath build/MCChat.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > archive.log 2>&1 \
            || { grep -E "error:" archive.log | sort -u | head -80; tail -40 archive.log; exit 1; }
          tail -3 archive.log
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleDisplayName' \
            "build/MCChat.xcarchive/Products/Applications/$(ls build/MCChat.xcarchive/Products/Applications)/Info.plist"

      - name: Check signing secrets
        if: ${{ !inputs.unsigned }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing signing secrets:$missing"; exit 1; fi
          echo "All three signing secrets present."

      # Signing is manual, provisioned by .github/scripts/asc_signing.py through the App Store Connect API.
      # xcodebuild's own key-based provisioning fails on the Xcode 27 runner ("Authentication failed")
      # even though the same key works when called directly, so Xcode never talks to Apple here.
      - name: Provision (App Store Connect API)
        if: ${{ !inputs.unsigned }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'PQ873CNW8A' }}
        run: |
          python3 -m pip install -q --break-system-packages pyjwt cryptography requests 2>/dev/null \
            || python3 -m pip install -q pyjwt cryptography requests
          python3 .github/scripts/asc_signing.py setup
          xcodegen
          python3 .github/scripts/asc_signing.py entitlements
          KC="$RUNNER_TEMP/sign.keychain-db"; KP=$(openssl rand -hex 16)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          P12PW=$(python3 -c "import json,os;print(json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'asc_signing.json')))['p12_password'])")
          security import "$RUNNER_TEMP/dist.p12" -P "$P12PW" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | sed 's/[0-9A-F]\{40\}/<sha>/'

      - name: Archive
        if: ${{ !inputs.unsigned }}
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'PQ873CNW8A' }}
        run: |
          xcodebuild archive -project ElementX.xcodeproj -scheme ElementX -configuration Release \
            -destination generic/platform=iOS -archivePath build/MCChat.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" > archive.log 2>&1 \
            || { grep -E "error:|warning: .*(sign|profile|certificate|entitlement)" archive.log | sort -u | head -80; tail -40 archive.log; exit 1; }
          tail -3 archive.log
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleDisplayName' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' \
            "build/MCChat.xcarchive/Products/Applications/$(ls build/MCChat.xcarchive/Products/Applications)/Info.plist"

      - name: Export and upload to TestFlight
        if: ${{ !inputs.unsigned }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          xcodebuild -exportArchive -archivePath build/MCChat.xcarchive -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" > export.log 2>&1 \
            || { grep -iE "error|failed" export.log | sort -u | head -40; tail -30 export.log; exit 1; }
          ls -la build/export
          if [ "$UPLOAD" != "true" ]; then echo "Upload off: IPA built and signed, not sent."; exit 0; fi
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          xcrun altool --upload-app -f build/export/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee upload.log
          grep -qiE "No errors uploading|UPLOAD SUCCEEDED" upload.log || { echo "::error::upload did not confirm"; exit 1; }

      - name: Revoke temporary certificate
        if: ${{ always() && !inputs.unsigned }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 .github/scripts/asc_signing.py revoke || true

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            archive.log
            export.log
            upload.log
          if-no-files-found: ignore
          retention-days: 14
